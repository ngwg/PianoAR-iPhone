name: PianoAR
options:
  bundleIdPrefix: com.copakerzyr
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""

targets:
  PianoAR:
    type: application
    platform: iOS
    sources:
      - path: PianoAR
    info:
      path: PianoAR/Info.plist
      properties:
        CFBundleDisplayName: PianoAR
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "2"
        UILaunchScreen: {}
        # ProMotion: without this key iPhone apps are capped at 60 Hz. The
        # 120 Hz display link drives the gyro re-projection (MotionWarp).
        CADisableMinimumFrameDurationOnPhone: true
        # Files app → On My iPhone → PianoAR: drop .mid/.json songs in.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: MIDI File
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.midi-audio
        UIRequiredDeviceCapabilities:
          - arkit
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "PianoAR uses the rear camera for AR passthrough so you can see your piano and the overlaid note guide while wearing the headset."
        NSMicrophoneUsageDescription: "PianoAR optionally listens for note onsets to cross-check vision-based press detection."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.copakerzyr.pianoar
        ENABLE_PREVIEWS: YES
